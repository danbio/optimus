<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Documento{% endblock %} — Optimus</title>
  {% load static %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  {% comment %}
    Reaproveita as variáveis de cor e classes utilitárias (.tabela, .badge) —
    nenhuma regra de .topbar/.sidebar/.main se aplica aqui, essas divs não
    existem nesta página.
  {% endcomment %}
  <link rel="stylesheet" href="{% static 'css/intelbras.css' %}">
  <link rel="stylesheet" href="{% static 'css/print.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <div class="print-toolbar no-print">
    <button type="button" onclick="window.print()">
      <i class="bi bi-printer"></i> Imprimir / Salvar como PDF
    </button>
    <button type="button" onclick="window.close()">Fechar</button>
  </div>

  {% block content %}{% endblock %}
</body>
</html>
